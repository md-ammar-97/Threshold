# Local development topology per architecture.md §6.1.
# Usage: cp .env.example .env (fill in secrets), then `docker compose up --build`.
#
# Host-side ports are non-default (5434/6381/8010) because this machine runs
# several other unrelated projects' containers on the conventional
# 5432/6379/8000 ports. Container-to-container traffic (api/worker ->
# postgres/redis) always uses the standard in-network ports below, so only
# the *_HOST_PORT values matter if you connect from the host (psql, a local
# redis-cli, curl).

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-instamart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-instamart}
      POSTGRES_DB: ${POSTGRES_DB:-instamart}
    ports:
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-instamart}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6381}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-instamart}:${POSTGRES_PASSWORD:-instamart}@postgres:5432/${POSTGRES_DB:-instamart}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${API_HOST_PORT:-8010}:8000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/config:/app/config:ro
      - ./prompts:/prompts:ro
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    command: ["celery", "-A", "instamart_engine.core.celery_app", "worker", "--loglevel=info"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-instamart}:${POSTGRES_PASSWORD:-instamart}@postgres:5432/${POSTGRES_DB:-instamart}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend/src:/app/src
      - ./backend/config:/app/config:ro
      - ./prompts:/prompts:ro
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    env_file:
      - .env
    environment:
      VITE_API_URL: http://localhost:${API_HOST_PORT:-8010}
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
