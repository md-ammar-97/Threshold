[project]
name = "instamart-engine"
version = "0.1.0"
description = "Backend for the Instamart Discovery Engine: ingestion, analysis, retrieval, and API services"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "celery[redis]>=5.4",
    "redis>=5.1",
    "pgvector>=0.3.5",
    "openai>=1.50",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "tenacity>=9.0",
    "google-play-scraper>=1.2.7",
    "langdetect>=1.0.9",
    "trafilatura>=1.12",
    "structlog>=24.4",
    "sentence-transformers>=3.2",
    "scikit-learn>=1.5",
    "pyyaml>=6.0",
    "pytesseract>=0.3.13",
    "pillow>=10.4",
    "feedparser>=6.0",
    "resend>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.12",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
packages = ["instamart_engine"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "p0_adversarial: zero-tolerance safety checks (ai_evals.md §62/§82) — prompt injection, PII/demographic inference, fabricated citations, causal overclaiming. Must stay green on every PR.",
]
